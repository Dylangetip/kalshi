<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bets — Kalshi Weather Trading Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="views.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "density": "comfortable",
  "accent": "amber"
}/*EDITMODE-END*/;

const ACCENTS = {
  amber:   'oklch(0.78 0.14 75)',
  green:   'oklch(0.74 0.16 145)',
  cyan:    'oklch(0.74 0.12 220)',
  magenta: 'oklch(0.7 0.18 330)',
};

// Tiny inline trendline for the ticker. Inherits color from its parent so
// the line picks up .pos / .neg from the surrounding edge cell. Renders
// nothing when there are fewer than 2 data points.
function MiniSpark({ data, width = 44, height = 14 }) {
  if (!data || data.length < 2) return null;
  const lo = Math.min(...data), hi = Math.max(...data);
  const range = hi - lo || 1;
  const step = width / (data.length - 1);
  const pts = data.map((v, i) =>
    `${(i * step).toFixed(1)},${(height - ((v - lo) / range) * height).toFixed(1)}`
  ).join(' ');
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}
         style={{ display: 'inline-block', verticalAlign: 'middle', marginRight: 6, opacity: 0.7 }}>
      <polyline points={pts} fill="none" stroke="currentColor" strokeWidth="1.2"
                strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tab, setTab] = useState('opportunities');
  const [states, setStates] = useState(() => MOCK.initialState());
  const [selectedCity, setSelectedCity] = useState('NYC');
  const [betLog, setBetLog] = useState([]);
  const [history] = useState(() => MOCK.buildHistory());
  const [positions, setPositions] = useState(() => MOCK.buildOpenPositions());
  const [closedPositions, setClosedPositions] = useState([]); // /api/closed-positions — all-time settled bets
  const [signals, setSignals] = useState(() => MOCK.buildSignals(MOCK.CITIES.find(c => c.code === 'NYC'), 1));
  const [now, setNow] = useState(new Date());
  const [tickFlash, setTickFlash] = useState({});
  const [dataSource, setDataSource] = useState('synthetic'); // 'live' | 'synthetic'
  const [edgeHistory, setEdgeHistory] = useState({}); // {NYC: [{ts, bestEdgeCents}, ...], ...}
  const [liveHistory, setLiveHistory] = useState(null); // session equity curve from /api/equity
  const [liveStats, setLiveStats] = useState(null);     // {settled, won, open, winRate, realizedPl}
  const [autoInfo, setAutoInfo] = useState(null);       // /api/auto-trade/info
  const [accuracy, setAccuracy] = useState(null);       // /api/accuracy
  const [mlInfo, setMlInfo] = useState(null);            // /api/ml/info
  const [mlDiagnostics, setMlDiagnostics] = useState(null); // /api/ml/diagnostics
  const [mlEvents, setMlEvents] = useState(null);           // /api/ml/events
  const [mlModelDiff, setMlModelDiff] = useState(null);     // /api/ml/model-diff

  // Theme + accent
  useEffect(() => {
    document.documentElement.dataset.theme = tweaks.theme;
    document.documentElement.style.setProperty('--accent', ACCENTS[tweaks.accent] || ACCENTS.amber);
  }, [tweaks.theme, tweaks.accent]);

  // Clock tick
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  // Backend bridge — pull real Open-Meteo / MOS / AFD data on mount and every 60s.
  // The 4s tick below keeps jittering Kalshi prices on top of whatever base state
  // is current, so live data and the synthetic ticker compose cleanly.
  useEffect(() => {
    let cancelled = false;
    const refresh = async () => {
      const live = await MOCK.fetchLiveState();
      if (cancelled || !live) return;
      // Preserve existing kalshi drift if a bracket of the same label still exists,
      // otherwise take the backend's price as-is.
      setStates(prev => live.map(ls => {
        const old = prev.find(p => p.city.code === ls.city.code);
        if (!old) return ls;
        const merged = ls.brackets.map(nb => {
          const ob = old.brackets.find(o => o.label === nb.label);
          return ob ? { ...nb, kalshiPct: ob.kalshiPct, yesPrice: ob.yesPrice, edge: nb.modelPct - ob.kalshiPct } : nb;
        });
        return { ...ls, brackets: merged };
      }));
      setDataSource('live');
    };
    refresh();
    const t = setInterval(refresh, 60_000);
    return () => { cancelled = true; clearInterval(t); };
  }, []);

  // Live data tick — every 4s, jitter the kalshi prices a touch + recompute edges
  useEffect(() => {
    const t = setInterval(() => {
      setStates(prev => prev.map(s => {
        const newBrackets = s.brackets.map(b => {
          const drift = (Math.random() - 0.5) * 0.018;
          const newK = Math.max(0.001, Math.min(0.999, b.kalshiPct + drift));
          return { ...b, kalshiPct: newK, edge: b.modelPct - newK, yesPrice: Math.round(newK * 100) };
        });
        const sumK = newBrackets.reduce((a, b) => a + b.kalshiPct, 0);
        const norm = newBrackets.map(b => ({ ...b, kalshiPct: b.kalshiPct / sumK, edge: b.modelPct - b.kalshiPct / sumK, yesPrice: Math.round(b.kalshiPct / sumK * 100) }));
        const best = norm.reduce((a, b) => b.edge > a.edge ? b : a, norm[0]);
        return {
          ...s,
          brackets: norm,
          settlementBracket: best,
          bestEdgeCents: Math.round(best.edge * 100),
          asof: Date.now(),
        };
      }));
      // Mark open positions to market. When the backend is live the server
      // owns the bet ledger and computes P/L against the latest cached state;
      // we just refresh from /api/positions. Offline, we drift locally so
      // the prototype keeps animating.
      if (dataSource === 'live') {
        MOCK.fetchPositions().then(rows => {
          if (rows) setPositions(rows);
        });
      } else {
        setPositions(prev => prev.map(p => {
          const newCur = Math.max(0.01, Math.min(0.99, p.current + (Math.random() - 0.5) * 0.012));
          const pl = (newCur - p.entry) * p.size * (p.side === 'YES' ? 1 : -1) * 100;
          return { ...p, current: +newCur.toFixed(3), pl: +pl.toFixed(2) };
        }));
      }
      setTickFlash({ t: Date.now() });
    }, 4000);
    return () => clearInterval(t);
  }, [dataSource]);

  // On going live, replace the local mock bet log + positions with whatever
  // is durable on the backend.
  useEffect(() => {
    if (dataSource !== 'live') return;
    let cancelled = false;
    Promise.all([MOCK.fetchBets(), MOCK.fetchPositions(), MOCK.fetchClosedPositions()]).then(([bets, pos, closed]) => {
      if (cancelled) return;
      if (bets) setBetLog(bets);
      if (pos) setPositions(pos);
      if (closed) setClosedPositions(closed);
    });
    return () => { cancelled = true; };
  }, [dataSource]);

  // Edge-history sparklines. Backend writes a snapshot per city every 5 min;
  // we pull the last 4h for each and render a tiny trendline next to the
  // ticker edge value. Empty / single-point histories render nothing.
  useEffect(() => {
    if (dataSource !== 'live') {
      setEdgeHistory({}); setLiveHistory(null); setLiveStats(null); setClosedPositions([]);
      return;
    }
    let cancelled = false;
    const refresh = async () => {
      const [edges, equity, stats, auto, acc, ml, diag, events, mdiff, closed] = await Promise.all([
        Promise.all(MOCK.CITIES.map(c => MOCK.fetchEdgeHistory(c.code, 4))),
        MOCK.fetchEquity(72),
        MOCK.fetchStats(),
        MOCK.fetchAutoTradeInfo(),
        MOCK.fetchAccuracy(),
        MOCK.fetchMlInfo(),
        MOCK.fetchMlDiagnostics(),
        MOCK.fetchMlEvents(100),
        MOCK.fetchMlModelDiff(),
        MOCK.fetchClosedPositions(),
      ]);
      if (cancelled) return;
      const map = {};
      MOCK.CITIES.forEach((c, i) => { if (edges[i]) map[c.code] = edges[i]; });
      setEdgeHistory(map);
      // Fall back to synthetic until at least 2 equity points have accrued —
      // a single-point chart is uglier than the synthetic backtest.
      setLiveHistory(equity && equity.length >= 2 ? equity : null);
      setLiveStats(stats);
      setAutoInfo(auto);
      setAccuracy(acc);
      setMlInfo(ml);
      setMlDiagnostics(diag);
      setMlEvents(events);
      setMlModelDiff(mdiff);
      if (closed) setClosedPositions(closed);
    };
    refresh();
    const t = setInterval(refresh, 60_000);
    return () => { cancelled = true; clearInterval(t); };
  }, [dataSource]);

  const effectiveHistory = liveHistory || history;

  const focus = states.find(s => s.city.code === selectedCity) || states[0];

  const placeBet = (cityCode, bracket, side, size) => {
    const time = new Date().toTimeString().slice(0, 8);
    const entry = side === 'YES' ? bracket.yesPrice : 100 - bracket.yesPrice;
    // Optimistic local update — works offline and gives instant feedback when live.
    setBetLog(log => [{ time, city: cityCode, bracket, side, size, entry }, ...log]);
    setPositions(prev => [{
      id: 'P' + (prev.length + 100),
      city: cityCode,
      bracket: bracket.label,
      side,
      size,
      entry: entry / 100,
      current: entry / 100,
      pl: 0,
    }, ...prev]);
    // When live, persist to backend — server will be the source of truth on
    // the next tick refresh.
    if (dataSource === 'live') {
      MOCK.persistBet({ cityCode, bracket, side, size, entry });
    }
  };

  const tabs = [
    { id: 'opportunities', label: 'Opportunities', badge: states.filter(s => s.bestEdgeCents > 3).length },
    { id: 'dashboard', label: 'City Dashboard' },
    { id: 'terminal', label: 'Trading Terminal' },
    { id: 'signals', label: 'Signals', badge: signals.filter(s => s.status === 'stale').length || null },
    { id: 'pnl', label: 'P&L' },
    { id: 'auto', label: 'Auto-Trade', badge: autoInfo?.enabled ? '●' : null },
    { id: 'ml', label: 'ML Model', badge: mlInfo?.latest_run?.trained ? '✓' : null },
    { id: 'db', label: 'DB' },
  ];

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark"></span>
          <span>BETS · v3.0</span>
        </div>
        <div className="tabs">
          {tabs.map(t => (
            <button key={t.id} className={`tab ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>
              {t.label}
              {t.badge != null && t.badge !== 0 && <span className="tab-badge">{t.badge}</span>}
            </button>
          ))}
        </div>
        <div className="topbar-right">
          <span className="live-dot"></span>
          <span>LIVE</span>
          <span style={{ color: 'var(--fg-3)' }}>·</span>
          <span className="clock">{now.toTimeString().slice(0, 8)}</span>
          <span style={{ color: 'var(--fg-3)' }}>·</span>
          <span>tick {Math.floor((tickFlash.t || Date.now()) / 4000) % 10000}</span>
        </div>
      </header>

      <div className="main">
        {/* City ticker — present on all tabs */}
        <div className="ticker">
          {states.map(s => {
            const hist = edgeHistory[s.city.code] || [];
            const sparkData = hist.map(h => h.bestEdgeCents);
            return (
              <div key={s.city.code}
                className={`ticker-item ${selectedCity === s.city.code ? 'active' : ''}`}
                onClick={() => setSelectedCity(s.city.code)}>
                <div className="ticker-row">
                  <span className="ticker-city">{s.city.code} · {s.city.label}</span>
                  <span className={`ticker-edge ${s.bestEdgeCents > 0 ? 'pos' : 'neg'}`}>
                    <MiniSpark data={sparkData} />
                    {fmtSign(s.bestEdgeCents)}¢
                  </span>
                </div>
                <div className="ticker-row">
                  <span className="ticker-station">{s.city.station} · {fmt(s.modelMax)}°F</span>
                  <span className="ticker-meta">{s.settlementBracket.label}</span>
                </div>
              </div>
            );
          })}
        </div>

        <div className="view">
          {tab === 'opportunities' && (
            <OpportunitiesView states={states} selectedCity={selectedCity} setSelectedCity={setSelectedCity} onPlaceBet={placeBet} history={effectiveHistory} />
          )}
          {tab === 'dashboard' && <DashboardView state={focus} history={effectiveHistory} />}
          {tab === 'terminal' && <TerminalView state={focus} onPlaceBet={placeBet} betLog={betLog} />}
          {tab === 'signals' && <SignalsView signals={signals} state={focus} />}
          {tab === 'pnl' && <PnLView history={effectiveHistory} positions={positions} closedPositions={closedPositions} states={states} liveHistory={liveHistory != null} stats={liveStats} />}
          {tab === 'auto' && (
            <AutoTradeView
              info={autoInfo}
              bets={betLog}
              positions={positions}
              states={states}
              onSetConfig={async (patch) => {
                const updated = await MOCK.setAutoTradeConfig(patch);
                if (updated) setAutoInfo(updated);
                return updated;
              }}
              onTriggerNow={async () => {
                const r = await MOCK.triggerAutoTradeNow();
                if (r) setAutoInfo({ ...r, interval_seconds: r.interval_seconds });
                // Refresh bet log so newly placed bets show up immediately
                MOCK.fetchBets().then(b => { if (b) setBetLog(b); });
                return r;
              }}
            />
          )}
          {tab === 'ml' && (
            <MlView
              mlInfo={mlInfo}
              accuracy={accuracy}
              diagnostics={mlDiagnostics}
              events={mlEvents}
              modelDiff={mlModelDiff}
              onMlBackfill={async (opts) => {
                const r = await MOCK.triggerMlBackfill(opts || {});
                if (r) setMlInfo(await MOCK.fetchMlInfo());
                return r;
              }}
              onMlTrain={async (algo) => {
                const r = await MOCK.triggerMlTrain(algo);
                if (r) setMlInfo(await MOCK.fetchMlInfo());
                return r;
              }}
              onModelConfig={async () => {
                // Re-fetch mlInfo so the "Active prediction model" panel
                // reflects the swap immediately after Apply.
                const fresh = await MOCK.fetchMlInfo();
                if (fresh) setMlInfo(fresh);
              }}
            />
          )}
          {tab === 'db' && <DbView />}
        </div>
      </div>

      <footer className="statusbar">
        <span>BETS v3.0</span>
        <span className="sep">|</span>
        <span>34 signals · 17 categories</span>
        <span className="sep">|</span>
        <span>
          <span className={`dot ${dataSource === 'live' ? 'pos' : 'warn'}`}></span>
          {' '}data: {dataSource === 'live'
            ? `live · ${[focus.sources?.metar && 'METAR', focus.sources?.gfsMos && 'MOS',
                         focus.sources?.afd && 'AFD', focus.sources?.kalshi && 'KALSHI']
                       .filter(Boolean).join('/') || 'OM'}`
            : 'synthetic'}
        </span>
        <span className="sep">|</span>
        <span>
          <span className={`dot ${focus.activeSource === 'ml' ? 'pos' : focus.activeSource === 'blend' ? 'info' : 'muted'}`}></span>
          {' '}model: {(focus.activeSource || 'ensemble').toUpperCase()}
        </span>
        <span className="sep">|</span>
        <span>paper trading</span>
        <span className="sep">|</span>
        <span>{focus.city.code} · {focus.city.station}</span>
        <span style={{ marginLeft: 'auto' }}>Quarter-Kelly sizing · ¼K cap 5%</span>
      </footer>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Appearance">
          <TweakRadio label="Theme" value={tweaks.theme} options={[['dark','Dark'],['light','Light']]} onChange={v => setTweak('theme', v)} />
          <TweakRadio label="Accent" value={tweaks.accent} options={[['amber','Amber'],['green','Green'],['cyan','Cyan'],['magenta','Magenta']]} onChange={v => setTweak('accent', v)} />
          <TweakRadio label="Density" value={tweaks.density} options={[['compact','Compact'],['comfortable','Comfortable']]} onChange={v => setTweak('density', v)} />
        </TweakSection>
        <TweakSection title="Live">
          <div style={{ fontSize: 11, color: 'var(--fg-2)', lineHeight: 1.5 }}>
            Prices tick every 4s. Place bets on any tab — they appear in P&L · Open positions, marking to market in real time.
          </div>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
