<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FundingHub Cart Tracker — Options</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           max-width: 560px; margin: 32px auto; padding: 0 20px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { color: #6b7280; margin: 0 0 20px; }
    label { display: block; font-weight: 600; margin: 16px 0 4px; }
    input[type=text], input[type=password] { width: 100%; padding: 8px 10px;
      border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
    .hint { color: #6b7280; font-size: 12px; margin-top: 4px; }
    button { margin-top: 20px; padding: 9px 16px; border: 0; border-radius: 8px;
      background: #0d9488; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #475569; margin-left: 8px; }
    #status { margin-top: 14px; font-weight: 600; min-height: 18px; }
    code { background: rgba(125,125,125,.18); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>FundingHub Cart Tracker</h1>
  <p class="sub">Where should captured cart items be sent?</p>

  <label for="endpoint">Endpoint URL</label>
  <input id="endpoint" type="text" placeholder="https://fundinghubdev.braintree4me.com/api/captures" />
  <div class="hint">Captures are POSTed here as JSON.</div>

  <label for="apiKey">API key (optional)</label>
  <input id="apiKey" type="password" placeholder="sent as Authorization: Bearer …" />

  <div class="row">
    <input id="enabled" type="checkbox" />
    <label for="enabled" style="margin:0">Tracking enabled</label>
  </div>

  <div>
    <button id="save">Save</button>
    <button id="test" class="secondary">Send test capture</button>
  </div>
  <div id="status"></div>

  <p class="hint" style="margin-top:24px">
    Install id: <code id="clientId">…</code><br />
    Pending (queued, unsent): <code id="queue">0</code>
  </p>

  <script src="options.js"></script>
</body>
</html>
